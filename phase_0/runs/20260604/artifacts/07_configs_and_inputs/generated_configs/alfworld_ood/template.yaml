# SkillGen Phase 0 ALFWorld OOD full-matrix config template.
# Replace <model_route>, <judge_model_route>, and <model_slug> before running.
# Deviation label: canonical ALFWorld data + reconstructed SkillGen offline-plan adapter.
models:
  default: "<judge_model_route>"
  baseline_agent: "<model_route>"
  baseline_judge: "<judge_model_route>"
  induction: "<judge_model_route>"
  induction_contextual: "<judge_model_route>"
  induction_summary: "<judge_model_route>"
  induction_pattern: "<judge_model_route>"
  induction_contrastive: "<judge_model_route>"
  generation_plan: "<judge_model_route>"
  generation_execute: "<judge_model_route>"
  refinement: "<judge_model_route>"
  verification_agent: "<model_route>"
  verification_judge: "<judge_model_route>"
  verification_case_analyst: "<judge_model_route>"
  verification_revision_synthesiser: "<judge_model_route>"

llm:
  temperature: 0.0
  max_tokens: 4096
  max_tokens_generation: 16384

embedding:
  model: "text-embedding-3-small"

clustering:
  method: "kmeans"
  n_clusters: null
  max_failure_clusters: 8
  max_success_clusters: 8
  min_clusters: 2
  target_cluster_size: 15
  min_cluster_size: 1

induction:
  max_contrastive_pairs: 20

generation:
  use_web_search: false
  max_search_queries: 0
  candidate_output_dir: "../../artifacts/raw_benchmark_outputs/full_matrix/alfworld_ood/<model_slug>/candidates"
  generate_scripts: false
  max_failure_clusters_in_prompt: 6
  max_success_clusters_in_prompt: 6
  max_contrastive_pairs_in_prompt: 8

verification_analysis:
  case_analyst_workers: 8
  case_analyst_max_tokens: 2048
  revision_synthesiser_max_tokens: 4096

verification:
  sample_size: 120
  min_sample: 20
  seed: 42
  min_net_gain_abs: 3
  min_net_gain_rel: 0.05

router:
  enabled: false
  model: "<judge_model_route>"
  max_workers: 16

pipeline:
  max_refine_rounds: 8
  baseline_runs_per_instance: 1
  max_workers: 16
  artifact_root: "../../artifacts/raw_benchmark_outputs/full_matrix/alfworld_ood/<model_slug>/artifacts/runs"

skill_output:
  path: "../../artifacts/raw_benchmark_outputs/full_matrix/alfworld_ood/<model_slug>/skill_output"

